# Usine à APK de Kalamu (LushiPratique)
# À chaque nouvel index.html, GitHub fabrique kalamu.apk et le met en ligne :
# https://micheltshiepela331-gif.github.io/KALAMU/kalamu.apk
# Il faut d'abord ajouter 2 secrets dans Settings > Secrets and variables > Actions :
#   KEYSTORE_B64 et KS_PASS
name: Fabriquer APK Kalamu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

permissions:
  contents: write
  actions: write

concurrency:
  group: apk-kalamu
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Prendre les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Vérifier la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Ajoutez les secrets KEYSTORE_B64 et KS_PASS dans Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Android
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          mkdir www
          cp ../index.html www/index.html
          npx cap init "Kalamu" com.lushipratique.kalamu --web-dir www
          npx cap add android
          # icône de Kalamu
          base64 -d > icon.png <<'FIN'
