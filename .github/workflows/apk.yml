name: Fabriquer APK Kalamu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']
permissions:
  contents: write
  actions: write
concurrency:
  group: apk-kalamu
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer Android
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          mkdir www && cp ../index.html www/
          npx cap init Kalamu com.lushipratique.kalamu --web-dir www
          npx cap add android
          R=android/app/src/main
          find $R/res -name 'splash.png' -delete
          rm -rf $R/res/mipmap-anydpi-v26
          mkdir -p $R/res/drawable
          python3 - <<'PY'
          import re, base64
          h = open('../index.html', encoding='utf-8').read()
          b = lambda i: re.search('id="' + i + '">(.*?)</script>', h, re.S).group(1).strip()
          r = 'android/app/src/main/'
          j = r + 'java/com/lushipratique/kalamu/'
          open(j + 'MainActivity.java', 'w').write(b('apk-main'))
          open(j + 'KalamuNativePlugin.java', 'w').write(b('apk-plugin'))
          open(r + 'res/drawable/splash.xml', 'w').write(b('apk-splash'))
          open('icon.png', 'wb').write(base64.b64decode(b('apk-icon')))
          PY
          for d in $R/res/mipmap-*dpi; do cp icon.png $d/ic_launcher.png; cp icon.png $d/ic_launcher_round.png; done
          sed -i 's/android:name=".MainActivity"/& android:screenOrientation="sensorLandscape"/' $R/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.${{ github.run_number }}\"/" android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Signer et publier
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Secrets KEYSTORE_B64 et KS_PASS manquants"; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > cle.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/android/app/build/outputs/apk/debug/app-debug.apk a.apk
          $BT/apksigner sign --ks cle.p12 --ks-pass env:KS_PASS --ks-key-alias kalamu --key-pass env:KS_PASS --out kalamu.apk a.apk
          rm -f cle.p12
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add kalamu.apk
          git commit -m "APK Kalamu 2.${{ github.run_number }}"
          git push
          gh workflow run static.yml --ref main
