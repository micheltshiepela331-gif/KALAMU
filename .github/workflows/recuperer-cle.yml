name: Recuperer cle
on: workflow_dispatch
jobs:
  cle:
    runs-on: ubuntu-24.04
    steps:
      - run: printf '%s' "$P" > mdp.txt
        env:
          P: ${{ secrets.KS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: mdp
          path: mdp.txt
          retention-days: 1
